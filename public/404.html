<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0e1f32" />
    <title>Página no encontrada | JM Gestión Documental</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #fefdfa;
        color: #0c1927;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 30rem; text-align: center; }
      .code { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-size: 5rem; font-weight: 600; line-height: 1; color: #0e1f32; }
      h1 { margin: 1rem 0 0; font-family: "Cormorant Garamond", Georgia, serif; font-size: 2rem; font-weight: 600; }
      p { margin: 0.75rem 0 0; line-height: 1.6; color: #56626e; }
      a.button {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.85rem 1.75rem;
        background: #e2bb6f;
        border: 1px solid #ecd49c;
        color: #0e1f32;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 2px;
      }
      a.button:hover { background: #ecd49c; }
      a.button:focus-visible { outline: 2px solid #0e1f32; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Página no encontrada</h1>
      <p>La página que buscás no existe o fue movida. Volvé al inicio para ver nuestros trámites y consultarnos.</p>
      <a class="button" href="/">Volver al inicio</a>
    </main>
  </body>
</html>
